<div class="auth-container">
  <div class="brand">
    <h1 class="brand-mark">UFO</h1>
    <span class="brand-sub">Universal File Observer</span>
  </div>

  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Create Account</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div *ngIf="error" class="error-message">
          {{ error }}
        </div>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" type="text" required>
          <mat-error *ngIf="f['username'].hasError('required')">
            Username is required
          </mat-error>
          <mat-error *ngIf="f['username'].hasError('minlength')">
            Username must be at least 3 characters
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password" required>
          <mat-error *ngIf="f['password'].hasError('required')">
            Password is required
          </mat-error>
          <mat-error *ngIf="f['password'].hasError('minlength')">
            Password must be at least 8 characters
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Confirm Password</mat-label>
          <input matInput formControlName="confirmPassword" type="password" required>
          <mat-error *ngIf="f['confirmPassword'].hasError('required')">
            Please confirm your password
          </mat-error>
          <mat-error *ngIf="form.hasError('passwordMismatch') && submitted">
            Passwords do not match
          </mat-error>
        </mat-form-field>

        <div class="button-container">
          <button mat-raised-button color="primary" type="submit" [disabled]="loading">
            <mat-spinner *ngIf="loading" diameter="20" class="spinner"></mat-spinner>
            <span *ngIf="!loading">Register</span>
          </button>
        </div>

        <div class="login-link">
          <p>Already have an account? <a (click)="goToLogin()" class="link">Login here</a></p>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
