<div class="dual-panel-container">
  <app-file-panel
    panelId="left"
    [isActive]="activePanel === 'left'"
    (activate)="setActive('left')">
  </app-file-panel>

  <div class="panel-divider"></div>

  <app-file-panel
    panelId="right"
    [isActive]="activePanel === 'right'"
    (activate)="setActive('right')">
  </app-file-panel>
</div>
