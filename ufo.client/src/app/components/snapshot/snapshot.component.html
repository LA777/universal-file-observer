<div class="snapshot-header">
  @if (snapshot) {
    <span class="snapshot-info" [title]="snapshot.id">
      <mat-icon class="folder-icon">folder</mat-icon>
      <span class="snapshot-name">{{snapshot.rootFolder?.name}}</span>
      <span class="snapshot-meta">{{formatTimestamp(snapshot.timestamp)}}</span>
      <span class="snapshot-id">{{snapshot.id}}</span>
    </span>
  } @else {
    <span class="loading-hint"><em>Loading snapshot...</em></span>
  }
</div>

<div class="explorer-container">
  <div class="tree-container">
    <mat-tree #tree [dataSource]="dataSource" [childrenAccessor]="childrenAccessor">

      <!-- Leaf folder (no subfolders) -->
      <mat-nested-tree-node *matTreeNodeDef="let node">
        <div class="tree-row leaf" [class.selected]="clickedNode === node" (click)="onNodeClick(node)">
          <mat-icon class="tree-folder-icon">folder</mat-icon>
          <span class="tree-label">{{node.name}}</span>
        </div>
      </mat-nested-tree-node>

      <!-- Expandable folder -->
      <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild" [cdkTreeNodeTypeaheadLabel]="node.name" isExpandable>
        <div class="tree-row" [class.selected]="clickedNode === node" (click)="onNodeClick(node)">
          <button matTreeNodeToggle class="tree-toggle" [attr.aria-label]="'Toggle ' + node.name" (click)="$event.stopPropagation()">
            <mat-icon>{{tree.isExpanded(node) ? 'expand_more' : 'chevron_right'}}</mat-icon>
          </button>
          <mat-icon class="tree-folder-icon">{{tree.isExpanded(node) ? 'folder_open' : 'folder'}}</mat-icon>
          <span class="tree-label">{{node.name}}</span>
        </div>
        <div class="tree-children" [class.tree-invisible]="!tree.isExpanded(node)">
          <ng-container matTreeNodeOutlet></ng-container>
        </div>
      </mat-nested-tree-node>

    </mat-tree>
  </div>

  <div class="file-list-container">
    <ag-grid-angular
      class="snapshot-files-grid"
      [theme]="gridTheme"
      [rowData]="folderData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [rowHeight]="28"
      [headerHeight]="28">
    </ag-grid-angular>
  </div>
</div>
