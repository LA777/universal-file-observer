<div class="explorer-container">
  <div class="tree-container">

    <mat-tree #tree [dataSource]="dataSource" [childrenAccessor]="childrenAccessor">

      <!-- This is the tree node template for leaf nodes -->
      <!-- matTreeNodePadding -->
      <mat-nested-tree-node #treeNode="matNestedTreeNode" *matTreeNodeDef="let node" class="mat-nested-tree-node">
        <!-- use a disabled button to provide padding for tree leaf -->
        <!-- <button mat-icon-button disabled></button> -->
        <div class="leaf-tree">
          <button (click)="onNodeClick(node)" [style.background-color]="clickedNode === node ? 'cyan' : ''">leaf:
            {{node.name}}</button>
        </div>

      </mat-nested-tree-node>

      <!-- This is the tree node template for expandable nodes -->
      <!-- matTreeNodePadding -->
      <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild" #treeNode="matNestedTreeNode"
        [cdkTreeNodeTypeaheadLabel]="node.name" isExpandable class="example-tree-node">

        <div class="mat-tree-node">

          <!-- Button for Expandable Tree item -->
          <!-- mat-icon-button -->
          <button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.name"
            class="expandable-tree-item-button example-toggle">

            <!-- Icon -->
            <mat-icon class="mat-icon-rtl-mirror">
              {{tree.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
            </mat-icon>

          </button>
          <button (click)="onNodeClick(node)" (click)="onNodeClick(node)"
            [style.background-color]="clickedNode === node ? 'cyan' : ''">expandable: {{node.name}}</button>
        </div>
        <!-- @if (node.isLoading()) {
        <mat-progress-bar mode="indeterminate" class="example-tree-progress-bar"></mat-progress-bar>
        } -->

        <!-- There is inline padding applied to this div using styles.
            This padding value depends on the mat-icon-button width.  -->
        <!-- role="group" -->
        <div [class.example-tree-invisible]="!tree.isExpanded(node)">
          <ng-container matTreeNodeOutlet></ng-container>
        </div>

      </mat-nested-tree-node>
    </mat-tree>



  </div>



  <div class="file-list-container">
    <!-- <div *ngIf="selectedFolder.files.length > 0"> -->

    <table mat-table [dataSource]="folderData" matSort (matSortChange)="announceSortChange($event)"
      class="mat-elevation-z8">

      <!-- Name Column -->
      <ng-container matColumnDef="Name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by Name">
          Name
        </th>
        <td mat-cell *matCellDef="let element">
          <mat-icon class="mat-icon-rtl-mirror"
            [ngStyle]="element.isHidden ? { color: 'grey' } : { color: 'black' }">description</mat-icon>
          {{element.name}}
        </td>
      </ng-container>

      <ng-container matColumnDef="Extension">
        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by Extension">
          Extension
        </th>
        <td mat-cell *matCellDef="let element"> {{element.fileExtension}} </td>
      </ng-container>

      <ng-container matColumnDef="Size">
        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by Size">
          Size
        </th>
        <td mat-cell *matCellDef="let element"> {{element?.size}} </td>
      </ng-container>

      <ng-container matColumnDef="Hidden">
        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by Hidden">
          Hidden
        </th>
        <td mat-cell *matCellDef="let element"> {{element.isHidden}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    <!-- </div> -->
  </div>
</div>
