<!-- role="separator" so it is announced as a divider rather than read as a
     stray heading; aria-label carries the meaning the rule and icon convey
     visually. -->
<div class="admin-divider" role="separator" aria-label="Administrator settings">
  <span class="admin-divider-rule"></span>
  <span class="admin-divider-label">
    <mat-icon aria-hidden="true">admin_panel_settings</mat-icon>
    Administrator settings
  </span>
  <span class="admin-divider-rule"></span>
</div>

<p class="admin-divider-hint">
  Everything below applies to this server and to everyone who uses it, not just to your
  account. Only administrators can change it.
</p>
