<div class="app-container">
  <!-- Header with logout button (only show when authenticated) -->
  <div class="app-header" *ngIf="(currentUser$ | async) as user">
    <div class="app-title">
      <h1>UFO</h1>
      <span class="app-subtitle">Universal File Observer</span>
    </div>
    <div class="user-info">
      <span class="user-name">
        <mat-icon>person</mat-icon>
        {{ user }}
      </span>
      <button mat-icon-button (click)="openSettings()" matTooltip="Settings">
        <mat-icon>settings</mat-icon>
      </button>
      <button mat-icon-button class="logout-button" (click)="logout()" matTooltip="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </div>

  <!-- Main content - routes render here (Login/Register/Dashboard) -->
  <router-outlet></router-outlet>
</div>
