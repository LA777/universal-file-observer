# Overlay for deployments where a reverse proxy in front of UFO terminates TLS.
#
#   docker compose -f docker-compose.yml -f docker-compose.no-tls.yml up -d
#
# The base image serves HTTPS on 8443 and nothing else. This swaps that single
# endpoint back to plaintext on 8080 and turns certificate handling off, which
# have to move together: Kestrel refuses to start an https:// endpoint it has no
# certificate for, and with Ufo__EnableHttps off nothing supplies one.
#
# Only use this where something in front is actually terminating TLS. On its own
# it puts credentials and JWTs on the wire in the clear.
services:
  ufo:
    environment:
      Ufo__EnableHttps: "false"
      Kestrel__Endpoints__App__Url: "http://0.0.0.0:8080"
    # Compose appends list fields rather than replacing them, so without
    # !override the base file's 8443 mapping would survive and publish a host
    # port with nothing behind it.
    ports: !override
      - "8080:8080"
